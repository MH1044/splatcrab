<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>SplatCrab</title>
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<div id="desktop">
<section id="files" class="pane" aria-labelledby="files-title">
<h2 id="files-title" class="pane-title">Files</h2>
<div id="files-path" class="path"></div>
<div class="pane-body"><ul id="files-list" class="list"></ul></div>
</section>
<div id="split-left" class="splitter" role="separator" aria-orientation="vertical" aria-label="Resize the file browser" aria-controls="files" tabindex="0"></div>
<div id="middle">
<section id="editor" class="pane" aria-label="Editor">
<div id="editor-bar">
<div id="tabs" role="tablist" aria-label="Open files"></div>
<div id="editor-tools">
<button type="button" id="new-file" class="tool" title="A new file">New</button>
<button type="button" id="save-file" class="tool" title="Save (Ctrl+S)">Save</button>
<button type="button" id="run-file" class="tool" title="Save and run the file (F5)">Run</button>
<button type="button" id="run-selection" class="tool" title="Run the selection, or the line the cursor is on (F9)">Run Selection</button>
</div>
</div>
<div id="save-as" class="ask" role="group" aria-labelledby="save-as-label" hidden>
<label id="save-as-label" for="save-path">Save as</label>
<input id="save-path" type="text" spellcheck="false" autocapitalize="off" autocomplete="off">
<button type="button" id="save-as-ok" class="tool">Save</button>
<button type="button" id="save-as-cancel" class="tool">Cancel</button>
</div>
<div id="close-ask" class="ask" role="alertdialog" aria-labelledby="close-text" hidden>
<span id="close-text"></span>
<button type="button" id="close-save" class="tool">Save</button>
<button type="button" id="close-discard" class="tool">Discard</button>
<button type="button" id="close-cancel" class="tool">Cancel</button>
</div>
<div id="editor-note" role="status"></div>
<div id="editor-hint" class="hint">No file is open: double-click one in the file browser, or choose New.</div>
<div id="editor-body" hidden>
<div id="gutter" aria-hidden="true"><div id="gutter-mark" hidden></div><pre id="gutter-lines"></pre></div>
<textarea id="code" wrap="off" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="The file's text"></textarea>
</div>
</section>
<div id="split-mid" class="splitter" role="separator" aria-orientation="horizontal" aria-label="Resize the editor against the command window" aria-controls="editor" tabindex="0"></div>
<section id="command" class="pane" aria-label="Command window">
<main id="transcript" aria-live="polite" aria-label="Transcript"></main>
<div id="prompt">
<span class="marker" aria-hidden="true">&gt;&gt;</span>
<textarea id="input" rows="1" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Command"></textarea>
</div>
<div id="completions" aria-live="polite" aria-label="Completions" hidden></div>
</section>
</div>
<div id="split-right" class="splitter" role="separator" aria-orientation="vertical" aria-label="Resize the workspace and the command history" aria-controls="side" tabindex="0"></div>
<div id="side">
<section id="workspace" class="pane" aria-labelledby="workspace-title">
<h2 id="workspace-title" class="pane-title">Workspace</h2>
<div class="pane-body">
<table id="vars">
<colgroup><col class="col-name"><col class="col-value"><col class="col-size"><col class="col-class"></colgroup>
<thead><tr><th scope="col">Name</th><th scope="col">Value</th><th scope="col">Size</th><th scope="col">Class</th></tr></thead>
<tbody id="vars-body"></tbody>
</table>
</div>
</section>
<div id="split-side" class="splitter" role="separator" aria-orientation="horizontal" aria-label="Resize the workspace against the command history" aria-controls="workspace" tabindex="0"></div>
<section id="history" class="pane" aria-labelledby="history-title">
<h2 id="history-title" class="pane-title">Command history</h2>
<div class="pane-body" id="history-body"><ul id="history-list" class="list"></ul></div>
</section>
</div>
</div>
</body>
</html>
